name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IDEVICE_SHA: 3e55c8486b2057e40c1f74aaaa1155c82341cf76
  IDEVICE_FEATURES: obfuscate,location_simulation

jobs:
  idevice:
    runs-on: macos-15
    steps:
      - name: Restore cached xcframework
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: IDevice.xcframework
          key: idevice-${{ env.IDEVICE_SHA }}-${{ env.IDEVICE_FEATURES }}-v1

      - name: Checkout SideStore/idevice (pinned)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: SideStore/idevice
          ref: ${{ env.IDEVICE_SHA }}
          submodules: true
          path: idevice-src

      - name: Add Rust iOS target
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-apple-ios

      - name: Build libidevice_ffi for iOS device
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: idevice-src/ffi
        run: |
          BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$(xcrun --sdk iphoneos --show-sdk-path)" \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          cargo build --release --target aarch64-apple-ios --features "$IDEVICE_FEATURES"

      - name: Create xcframework
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: idevice-src
        run: |
          cp ffi/idevice.h swift/include/idevice.h
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libidevice_ffi.a -headers swift/include \
            -output "$GITHUB_WORKSPACE/IDevice.xcframework"

      - name: Show location-related symbols
        run: |
          find IDevice.xcframework -name "*.a" -exec sh -c 'ls -l "$1"; nm -g "$1" 2>/dev/null | grep -i -E "location_simulation|remote_server_|process_control_new" | sort -u | head -40' _ {} \;

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: IDevice-xcframework
          path: IDevice.xcframework

  build:
    needs: idevice
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch custom IDevice xcframework
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: IDevice-xcframework
          path: Vendor/IDevice.xcframework

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project LockdownTest.xcodeproj \
            -scheme LockdownTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LockdownTest.app Payload/
          zip -qr LockdownTest.ipa Payload

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LockdownTest-unsigned-ipa
          path: LockdownTest.ipa
