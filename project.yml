name: LockdownTest
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Minimuxer:
    path: Vendor/minimuxer
targets:
  LockdownTest:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: Minimuxer
        product: Minimuxer
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Lockdown Test
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocationWhenInUseUsageDescription: Used only to start a simulated drive from your real position.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Probes the on-device loopback tunnel for testing.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockdowntest.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
